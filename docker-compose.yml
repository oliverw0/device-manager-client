services:
  devicemanager-client:
    build: .
    container_name: devicemanager-client
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Lets the client see sibling containers on this Docker host. Read-only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # So the client reports the machine's name, not the container id. Read-only.
      - /etc/hostname:/host/etc/hostname:ro
      # OPTIONAL - Tailscale status. Only uncomment this if the host actually
      # runs Tailscale, otherwise Docker refuses to start the container with
      # "bind mount failed: /var/run/tailscale does not exist". Left out, the
      # client simply reports "No Tailscale client" and keeps running.
      # - /var/run/tailscale:/var/run/tailscale:ro
      # OPTIONAL - SSH auth activity from the host's logs. Without it, ssh_auth
      # reports all-zero. Uncomment whichever your distro has.
      # - /var/log/auth.log:/var/log/auth.log:ro
      # - /var/log/secure:/var/log/secure:ro
      # OPTIONAL - apt update-staleness of the HOST (not the container). Mount the
      # host's apt state read-only and set APT_STATE_DIR below. Without it, apt
      # reports "not available" and the device is never flagged for updates.
      # (Upgradable *count* stays native-only; staleness age works via this mount.)
      # - /var/lib/apt:/host/var/lib/apt:ro
    # environment:
    #   - APT_STATE_DIR=/host/var/lib/apt
