services:
  devicemanager-client:
    build: .
    container_name: devicemanager-client
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Lets the client see sibling containers on this Docker host. Read-only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # OPTIONAL - Tailscale status. Only uncomment this if the host actually
      # runs Tailscale, otherwise Docker refuses to start the container with
      # "bind mount failed: /var/run/tailscale does not exist". Left out, the
      # client simply reports "No Tailscale client" and keeps running.
      # - /var/run/tailscale:/var/run/tailscale:ro
      # OPTIONAL - SSH auth activity from the host's logs. Without it, ssh_auth
      # reports all-zero. Uncomment whichever your distro has.
      # - /var/log/auth.log:/var/log/auth.log:ro
      # - /var/log/secure:/var/log/secure:ro
